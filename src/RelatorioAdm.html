<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrador</title>
    <link rel="stylesheet" href="CabecalhoAdm.css">
    <link rel="stylesheet" href="RelatorioAdm.css">
    <link rel="shortcut icon" href="imagem/estrela.jpg" type="image/x-icon">
    <link href='https://fonts.googleapis.com/css?family=Sora' rel='stylesheet'>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header class="header">
        <img src="./logos/logopaginaprincipal3.png" alt="Logo da Empresa">
        <div class="title-container">
            <h1>Painel de Administrador</h1>
        </div>

        <div class="container-options">
            <button class="btn-main">☰ Opções</button>
            <div class="options">
                <a href="CriarAdm.html">Adicionar Evento</a>
                <a href="SolicitacaoAdm.html">Solicitações de Eventos</a>
                <a href="FuturoAdm.html">Eventos Futuros</a>
                <a href="#">Relatório de Eventos</a>
            </div>
            <button id="sair" href="#" onclick="logout(event)">Sair</button>
        </div>

        <div class="menu">
            <a href="CriarAdm.html">
                <i class="fas fa-calendar-plus"></i>
                Criar Evento</a>
            <a href="#">
                <i class="fas fa-envelope-open-text"></i> Solicitações</a>
            <a href="FuturoAdm.html">
                <i class="fas fa-calendar-alt"></i> Eventos</a>
            <a href="RelatorioAdm.html">
                <i class="fas fa-chart-bar"></i>
                Relatório</a>
            <a id="sair" href="#" onclick="logout(event)">
                <i class="fas fa-sign-out-alt"></i> Sair
            </a>
        </div>
    </header>


    <div class="horizontal-section">
        <section class="event-report-section" id="event-report-section">
            <div class="section-title" id="event-report-title">
                <h2><i class="fas fa-chart-bar"></i> Relatório de Eventos</h2>
            </div>
            <form id="filter-form">
                <div class="select-container">
                    <select name="opcao" class="event-card-button option">
                        <option value="" selected>Todos Eventos</option>
                        <option value="aprovado">Aprovados</option>
                        <option value="reprovado">Reprovados</option>
                        <option value="em analise">Em Análise</option>
                    </select>
                    <input type="date" name="dataOpcao" class="event-card-button date" />
                    <button type="submit" class="event-card-button filter">Filtrar</button>
                </div>
            </form>
            <div class="event-cards-container" id="event-cards-container">
            </div>
        </section>

        <div class="modal-infos">
            <div class="modal-overlay" id="modal">
                <div class="modal-content">
                    <form>
                        <h2 class="modal-title" id="modal-title"><i class="fas fa-award"></i>
                            <strong></strong></h2>
                        <p><strong><i class="fas fa-spinner" style="color: #91b81e;"></i>
                             Status:</strong> <span id="event_status"></span></p>
                        <input type="hidden" id="event_id" name="event_id" value="" />
                        <p><strong><i class="fas fa-calendar-check" style="color: #91b81e;"></i>
                             Data:</strong> <span id="event_date"></span></p>
                        <p><strong><i class="fas fa-clock" style="color: #91b81e;"></i>
                             Horário:</strong> <span id="event_time"></span></p>
                        <p><strong><i class="fas fa-map" style="color: #91b81e;"></i>
                             Local:</strong> <span id="event_location"></span></p>
                        <p><strong><i class="fas fa-hourglass-start" style="color: #91b81e;"></i>
                             Duração:</strong> <span id="event_duration"></span></p>
                        <p><strong><i class="fas fa-users" style="color: #91b81e;"></i>
                             Vagas Disponíveis:</strong> <span id="event_slots"></span></p>
                        <p><strong><i class="fas fa-id-badge" style="color: #91b81e;"></i>
                             Responsável:</strong> <span id="event_responsible"></span></p>
                        <p><strong>Descrição:</strong> <span id="event_description"></span></p>
                    </form>

                    <button type="button" onclick="closeModal('modal')" class="event-card-button close">Fechar</button>
                </div>
            </div>
            <div class="modal-participants">
                <div class="modal-overlay" id="modal-participant">
                    <div class="modal-content">
                        <h2 class="modal-title" id="modal-title"><strong>Participantes</strong></h2>
                        <ul id="participantList"></ul>
                        <button class="event-card-button close"
                            onclick="closeModal('modal-participant')">Fechar</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="RelatorioAdm.js"></script>
        <script src="CabecalhoAdm.js"></script>
</body>

</html>
